plugins {
    id 'com.android.application'
}

android {
    namespace 'de.heizung.steuerung'
    compileSdk 34

    defaultConfig {
        applicationId "de.heizung.steuerung"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Fester Schluessel: Updates lassen sich dadurch ueber die alte App installieren, ohne zu deinstallieren
    signingConfigs {
        release {
            storeFile file('heizung.keystore')
            storePassword 'heizung2026'
            keyAlias 'heizung'
            keyPassword 'heizung2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
